services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tradecore
      POSTGRES_USER: tradecore
      POSTGRES_PASSWORD: tradecore
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradecore"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/tradecore
      DB_USERNAME: tradecore
      DB_PASSWORD: tradecore
    depends_on:
      db:
        condition: service_healthy